# qr_scanner_pi4 configuration - key=value, # comments allowed.

# --- Camera ---
camera_index=0
req_width=1280
req_height=720

# --- Calibration ---
focal_length_px=800.0
qr_real_size_m=0.20

# --- Alignment tolerances ---
size_tolerance=0.15
center_tolerance_px=100.0
require_alignment=false
reference_distance_m=1.0

# --- Speed & Frequency tuning ---
# detect_scale: QR search runs on frame at 50% resolution
detect_scale=0.5
burst_count=5

# target_cycle_ms: scan cycle pacing target (50ms = ~20 Hz = smooth live feed)
target_cycle_ms=50

# --- Capture + send ---
output_dir=./captures
hook_script=./hooks/send_capture.sh
jpeg_quality=92

# cooldown_ms: minimum delay between saved captures of repeated QR payload (15000ms = 15s)
cooldown_ms=3000

# --- Directional guidance ---
edge_margin_px=40
move_hook_script=./hooks/move_command.sh
move_cooldown_ms=500

single_shot=false
max_runtime_s=0
verbose=true
show_display=true
